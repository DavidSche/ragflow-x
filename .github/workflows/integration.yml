# Integration test workflow for ragflow-x
#
# Runs the full Go test suite on Linux, including PostgreSQL-dependent tests.
#
# Triggers:
#   - On push/merge to main (post-merge validation)
#   - On demand via workflow_dispatch

name: Integration

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: 0

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 80

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragflow_x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 10); do
            pg_isready -h localhost -U postgres && break
            sleep 2
          done

      - name: Install CJK fonts (PDF export)
        run: |
          # wqy-zenhei carries TrueType (glyf) outlines, which is what the PDF
          # renderer can embed. fonts-noto-cjk is CFF/OTTO only and is kept so the
          # font probe is exercised on a real collection it has to reject.
          set -u
          # The hosted image points apt at the Azure mirror
          # (mirror+file:/etc/apt/apt-mirrors.txt). When that host's DNS breaks,
          # resolution hangs rather than failing fast: on the v0.5.1 tag one blip
          # reddened three pipelines, and an unbounded retry then sat in this step
          # for 30 minutes. Pin the archive and bound every call with a wall clock.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|.*|http://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt
          fi
          APT_OPTS="-o Acquire::http::Timeout=20 -o Acquire::Retries=2 -o Acquire::ForceIPv4=true"
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get $APT_OPTS update &&
               sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get -y $APT_OPTS install fonts-noto-cjk fonts-wqy-zenhei; then
              sudo fc-cache -f >/dev/null 2>&1 || true
              exit 0
            fi
            echo "::warning::CJK font install attempt ${attempt} failed (mirror/DNS); retrying in 10s"
            sleep 10
          done
          echo "::error::CJK fonts could not be installed after 3 bounded attempts; the ubuntu mirror was unreachable. Re-run this job once the network recovers."
          exit 1

      - name: Run all tests (with PostgreSQL)
        env:
          RGX_DB_DSN: "postgres://postgres:postgres@localhost:5432/ragflow_x_test?sslmode=disable"
          RGX_TEST_POSTGRES_DSN: "postgres://postgres:postgres@localhost:5432/ragflow_x_test?sslmode=disable"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          go test -v -count=1 -shuffle=on -timeout 30m ./... 2>&1 | tee test-results/integration-full.log || {
            echo "## Integration full tests failed" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^--- FAIL' test-results/integration-full.log | head -120 | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            grep -A 80 -E '^--- FAIL' test-results/integration-full.log | head -280 | awk '{printf "::error title=F%06d::%s\n", NR, $0}' || true

            grep -E '^[[:space:]]+/?[^ ]+_test\.go:[0-9]+:' test-results/integration-full.log | head -150 | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            grep -E '^(panic:|FAIL|ok .*FAIL)' test-results/integration-full.log | head -60 | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            tail -40 test-results/integration-full.log | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            exit 1
          }

      - name: Run race gate
        shell: bash
        run: |
          set -o pipefail
          echo '--- race gate ---'
          CGO_ENABLED=1 go test -race -count=1 -shuffle=on -timeout 50m ./... 2>&1 | tee test-results/integration-race.log || {
            echo "## Integration race gate failed" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^--- FAIL' test-results/integration-race.log | head -120 | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            grep -A 80 -E '^--- FAIL' test-results/integration-race.log | head -280 | awk '{printf "::error title=F%06d::%s\n", NR, $0}' || true

            grep -E '^[[:space:]]+/?[^ ]+_test\.go:[0-9]+:' test-results/integration-race.log | head -150 | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            grep -E '^(panic:|FAIL|ok .*FAIL|DATA RACE)' test-results/integration-race.log | head -60 | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            tail -40 test-results/integration-race.log | awk '{printf "::error title=H%06d::%s\n", NR, $0}' || true
            exit 1
          }

      - name: Upload integration logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs
          path: test-results/*.log
          retention-days: 7

      - name: Generate quality report
        run: make test-quality-report

      - name: Upload quality report
        uses: actions/upload-artifact@v7
        with:
          name: integration-scenario-quality-report
          path: test-results/scenario-quality-report.json
          retention-days: 30

      # Build production binary with version stamp
      - name: Build production server binary
        run: |
          VERSION=$(date +%Y%m%d-%H%M)
          go build -ldflags="-s -w -X main.version=v$VERSION" -o ragflow-x-server ./cmd/server/
          echo "Binary built: $(wc -c < ragflow-x-server) bytes"
