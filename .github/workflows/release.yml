# Release workflow for ragflow-x
#
# Triggers:
#   - Push a version tag (v1.2.3 etc.) -> build release packages + container image,
#     then create the GitHub Release
#   - workflow_dispatch manual trigger -> requires the `version` input
#
# Flow:
#   1. build job: cross-compile Go binaries (linux/amd64, linux/arm64, darwin/amd64,
#      windows/amd64) with the release version stamped into main.version, build the
#      frontend, package everything into tarballs with SHA256SUMS
#   2. docker job (opt-in): build & push the multi-arch image to ghcr.io. It only
#      runs when the repository variable PUSH_IMAGE is "true"; until the registry
#      path is settled, releases ship binary archives only and the release notes
#      omit the `docker pull` line so they cannot advertise an image that does not
#      exist. `release` does not `needs` this job, so skipping it never blocks a
#      release.
#   3. release job: download artifacts, verify SHA256 checksums (integrity gate),
#      render release notes from git history, create the GitHub Release and upload

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3; tag pushes take the tag)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Resolve version
        id: meta
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            if [ -z "$VERSION" ]; then
              echo "::error::workflow_dispatch requires the version input"
              exit 1
            fi
            case "$VERSION" in
              *[!0-9A-Za-z._-]*) echo "::error::version contains invalid characters"; exit 1 ;;
            esac
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Building version: v$VERSION"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      # go:embed cannot reach outside internal/webfs, so the built web assets
      # are copied there for embedding (and stay available for the standalone
      # web tarball from web/dist).
      - name: Stage frontend assets for embedding
        run: |
          rm -rf internal/webfs/dist
          mkdir -p internal/webfs/dist
          cp -r web/dist/. internal/webfs/dist/

      - name: Build Go binaries (cross-platform, version stamped, frontend embedded)
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          LDFLAGS="-s -w -X main.version=v${VERSION}"
          mkdir -p dist
          # webfs_embed pulls the built frontend into every binary, so each
          # release archive serves API + UI out of the box.

          # linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags=webfs_embed -ldflags="$LDFLAGS" -o dist/ragflow-x-linux-amd64 ./cmd/server/

          # linux/arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -tags=webfs_embed -ldflags="$LDFLAGS" -o dist/ragflow-x-linux-arm64 ./cmd/server/

          # darwin/amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 \
            go build -tags=webfs_embed -ldflags="$LDFLAGS" -o dist/ragflow-x-darwin-amd64 ./cmd/server/

          # windows/amd64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -tags=webfs_embed -ldflags="$LDFLAGS" -o dist/ragflow-x-windows-amd64.exe ./cmd/server/

      - name: Package release artifacts
        run: |
          TAG="${{ steps.meta.outputs.version }}"
          cd dist

          # Shared layout staged once, then merged into every platform
          # package: binary at the root + config/docker/README companions so
          # users can configure and deploy right after unpacking.
          mkdir -p bundle/config bundle/docker
          cp ../config/config.example.yaml bundle/config/
          cp ../docker/docker-compose.yml ../docker/.env.example ../docker/ragflow-x.yaml bundle/docker/
          cp ../README.md bundle/
          # CHANGELOG ships with the archive so the supported engine band and the
          # known-upstream-issue ledger travel with the binaries, not just the
          # release page.
          cp ../CHANGELOG.md bundle/

          # Package each binary with the shared layout
          for f in ragflow-x-*; do
            case "$f" in
              *.exe)
                rm -rf stage; cp -r bundle stage; mv "$f" stage/ragflow-x.exe
                ( cd stage && zip -qr "../ragflow-x-${TAG}-windows-amd64.zip" . )
                ;;
              *)
                chmod +x "$f"
                platform="$(echo "$f" | sed 's/ragflow-x-//')"
                rm -rf stage; cp -r bundle stage; mv "$f" "stage/ragflow-x"
                tar czf "ragflow-x-${TAG}-${platform}.tar.gz" -C stage .
                ;;
            esac
          done

          # Package frontend build (standalone, for separate static hosting)
          tar czf "ragflow-x-${TAG}-web.tar.gz" -C ../web dist/

          # Source snapshot
          cd ..
          git archive --format=tar.gz --prefix="ragflow-x-${TAG}/" -o "dist/ragflow-x-${TAG}-src.tar.gz" HEAD

          # SHA256SUMS
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          echo "--- Release artifacts ---"
          ls -lh *.tar.gz *.zip SHA256SUMS

          # Guard: every platform package must carry binary + config + docker
          # companions (regression net for the bare-binary packaging bug).
          for pkgname in ragflow-x-*.tar.gz ragflow-x-*.zip; do
            case "$pkgname" in
              ragflow-x-"${TAG}"-src.tar.gz|ragflow-x-"${TAG}"-web.tar.gz) continue ;;
            esac
            listing=$(tar tzf "$pkgname" 2>/dev/null || unzip -Z1 "$pkgname")
            for required in "config/config.example.yaml" "docker/docker-compose.yml" "README.md"; do
              echo "$listing" | grep -Eq "(^|/)${required}$" || {
                echo "::error::${pkgname} is missing ${required}"; exit 1;
              }
            done
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  docker:
    needs: build
    # Opt-in: binary archives are the supported install path until an image
    # registry is available. Set the PUSH_IMAGE repository variable to "true" to
    # re-enable publishing; nothing else in this workflow has to change.
    if: vars.PUSH_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The `ragflow-x` container package predates this repository's Actions
          # (v0.2.x images were pushed by hand), so it does not grant the repo's
          # GITHUB_TOKEN write access and the push is refused with
          # `denied: permission_denied: write_package`. Setting a GHCR_TOKEN
          # secret (classic PAT with write:packages) works around the one-time
          # "Manage Actions access" step in the package settings.
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || github.token }}

      - name: Compute image tags (ghcr requires lowercase)
        id: tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="${{ needs.build.outputs.tag }}"
          TAGS="${IMAGE}:${VERSION}"
          # `latest` follows the newest stable release. Pre-releases (vX.Y.Z-rc1,
          # -drill, ...) never claim it, so a rehearsal cannot repoint the default
          # pull. This also covers workflow_dispatch re-runs, which is how a failed
          # docker leg gets retried after the release is already published.
          if [[ "$VERSION" != *-* ]]; then
            TAGS="${TAGS}
          ${IMAGE}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        id: buildpush
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.build.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A raw `denied: permission_denied: write_package` gives an operator
      # nothing to act on, and this job is the last leg of a release that has
      # already published its artifacts. Turn it into the two real remedies.
      - name: Explain container registry refusal
        if: steps.buildpush.outcome == 'failure'
        run: |
          set -euo pipefail
          PACKAGE="${GITHUB_REPOSITORY#*/}"
          cat >&2 <<MSG
          ::error title=ghcr push denied::The image was built but ghcr.io refused the push.
          The container package '${PACKAGE}' already exists under a namespace that does not
          grant this repository's GITHUB_TOKEN write access, which surfaces as
          'denied: permission_denied: write_package'.

          Fix it once, either way:
            1. https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE}/settings
               -> "Manage Actions access" -> add repository ${GITHUB_REPOSITORY} with role Write;
            2. or add a GHCR_TOKEN repository secret holding a classic PAT with write:packages.

          Then re-run this workflow: Actions -> Release -> Run workflow (version=${GITHUB_REF_NAME:-see tag}).
          MSG
          exit 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository (full history for release notes)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: artifacts/dist

      - name: Verify SHA256 checksums
        run: |
          set -euo pipefail
          cd artifacts/dist
          [ -f SHA256SUMS ] || { echo "::error::SHA256SUMS missing"; exit 1; }
          sha256sum -c SHA256SUMS

      # `gh release create` has no --notes-template flag; render the notes here
      # and pass them via --notes-file.
      - name: Render release notes
        run: |
          set -euo pipefail
          TAG="${{ needs.build.outputs.tag }}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # Pull the engine-support and upstream-issue blocks straight out of
          # CHANGELOG.md so the release page can never drift from the shipped
          # ledger. Each extractor prints the body of one `### <heading>` block,
          # stopping at the next `### ` heading.
          changelog_block() {
            awk -v heading="### $1" '
              $0 == heading {inside = 1; next}
              inside && /^### / {exit}
              inside {print}
            ' CHANGELOG.md | sed -e '/./,$!d'
          }
          SUPPORTED_BLOCK="$(changelog_block 'Supported engine versions')"
          UPSTREAM_BLOCK="$(changelog_block 'Known upstream issues (RAGFlow v1.0.0)')"
          # The image only exists when the docker leg ran (see that job's `if:`);
          # advertising it otherwise sends users to a 404 on the registry.
          PUSH_IMAGE="${{ vars.PUSH_IMAGE == 'true' }}"

          {
            echo "## ragflow-x ${TAG}"
            echo
            if [ -n "$PREV" ]; then
              echo "自 **${PREV}** 以来的变更（共 $(git rev-list --count "${PREV}..${TAG}") 个提交）："
              echo
              git log --no-merges --format='- %s' "${PREV}..${TAG}"
            else
              echo "🎉 首次发版"
            fi
            echo
            echo "---"
            echo
            if [ -n "$SUPPORTED_BLOCK" ]; then
              echo "### 支持的 RAGFlow 引擎版本"
              echo
              echo "$SUPPORTED_BLOCK"
            else
              echo "### 支持的 RAGFlow 引擎版本"
              echo
              echo "已验证带见 CHANGELOG.md 与 README 的引擎兼容矩阵。"
            fi
            echo
            if [ -n "$UPSTREAM_BLOCK" ]; then
              echo "### 仍在的上游缺陷（RAGFlow v1.0.0）"
              echo
              echo "$UPSTREAM_BLOCK"
            else
              echo "### 仍在的上游缺陷"
              echo
              echo "台账见 CHANGELOG.md「Known upstream issues」与运维 Runbook「已知上游缺陷台账」。"
            fi
            echo
            echo "---"
            echo
            echo "### 安装"
            echo
            echo '```bash'
            echo "# Linux (amd64) — binary ships with the UI embedded; config is included"
            echo "tar xzf ragflow-x-${TAG}-linux-amd64.tar.gz"
            echo "cp config/config.example.yaml config/config.yaml && ./ragflow-x"
            echo
            echo "# Windows (amd64) — 解压后直接双击，或"
            echo "ragflow-x.exe"
            echo "# 打开 http://localhost:9191/ ：无可用数据库时进入配置向导，向导完成后原地切换"
            echo
            echo '```'
            if [ "${PUSH_IMAGE}" = "true" ]; then
              echo
              echo "容器镜像："
              echo
              echo '```bash'
              echo "docker pull ${IMAGE}:${TAG}"
              echo '```'
            else
              echo
              echo "> 本版本**不提供容器镜像**：请使用上面的 release 二进制包（前端已内嵌）。"
              echo "> 需要镜像时可从源码构建：`cd docker && docker compose up -d --build`。"
            fi
            echo
            echo "### 校验"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS"
            echo '```'
            echo
            echo "---"
            echo
            echo "_本说明由 GitHub Actions 自动生成（release.yml）。资产清单见下方 Assets。_"
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release and upload artifacts
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          echo "Creating release: $TAG"
          ls -lh artifacts/dist/*.tar.gz artifacts/dist/*.zip artifacts/dist/SHA256SUMS
          # Idempotent by design: a re-run (workflow_dispatch after a failed docker
          # leg, or a re-pushed tag) must not die on "release already exists" - it
          # refreshes notes/title and clobbers the assets, so the published page
          # always matches the current CHANGELOG extraction.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refreshing notes and assets."
            gh release edit "$TAG" \
              --notes-file release-notes.md \
              --title "ragflow-x $TAG"
            gh release upload "$TAG" \
              artifacts/dist/*.tar.gz \
              artifacts/dist/*.zip \
              artifacts/dist/SHA256SUMS \
              --clobber
          else
            gh release create "$TAG" \
              artifacts/dist/*.tar.gz \
              artifacts/dist/*.zip \
              artifacts/dist/SHA256SUMS \
              --notes-file release-notes.md \
              --title "ragflow-x $TAG"
          fi
