groups:
  - name: ragflow-x-operational-contracts
    interval: 30s
    rules:
      - alert: AlertDeliveryCompensationSkippedHigh
        expr: "increase(ragflow_x_alert_delivery_compensation_skipped_total[15m]) > 50"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Alert delivery compensation skipped rows are accumulating"
          description: "More than 50 delivery compensation rows were skipped in 15 minutes. Inspect lease TTLs and compensation worker concurrency."
          runbook: "doc/develop/08_部署运维与可观测性.md"

      - alert: AlertDeliveryAbandoned
        expr: "increase(ragflow_x_alert_delivery_compensation_abandoned_total[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Alert deliveries were abandoned"
          description: "A delivery exhausted its compensation policy. Check webhook targets and delivery attempts, then perform manual recovery."
          runbook: "doc/develop/08_部署运维与可观测性.md"

      - alert: AlertDeliveryFencedResult
        expr: "increase(ragflow_x_alert_delivery_compensation_fenced_total[5m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Stale alert delivery result was fenced"
          description: "A stale worker attempted to write a delivery result. Preserve worker diagnostics and lease audit evidence before restarting."
          runbook: "doc/develop/08_部署运维与可观测性.md"

      - alert: ResourceSyncItemsFailedHigh
        expr: "increase(ragflow_x_resource_sync_items_total{status=\"failed\"}[15m]) > 5"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Resource sync failure rate is elevated"
          description: "More than five resource sync items failed in 15 minutes. Inspect RAGFlow connectivity, mappings, and item errors."
          runbook: "doc/develop/08_部署运维与可观测性.md"

      - alert: CompilationUpstreamStalled
        expr: "max by (tenant_id, kind) (ragflow_x_compilation_upstream_stall_seconds) > 86400"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Compilation upstream status is stalled"
          description: "A pending/running compilation has not advanced for 24 hours. Inspect the RAGFlow scheduler, phase, inflight and backlog diagnostics before manual recovery."
          runbook: "doc/runbooks/CompilationUpstreamRecoveryRunbook.md"

      - alert: CompilationUnknownAgeWarning
        expr: "max by (tenant_id, kind) (ragflow_x_compilation_unknown_age_seconds) > 86400"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation unknown recovery is aging"
          description: "An unknown compilation run has remained unresolved for 24 hours. Use the read-only recovery probe and preserve evidence; never auto-retry."
          runbook: "doc/runbooks/CompilationUpstreamRecoveryRunbook.md"

      - alert: CompilationUnknownAgeCritical
        expr: "max by (tenant_id, kind) (ragflow_x_compilation_unknown_age_seconds) > 259200"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Compilation unknown recovery requires escalation"
          description: "An unknown compilation run has remained unresolved for 72 hours. Review the recovery evidence, tenant approval, and downstream-binding candidates."
          runbook: "doc/runbooks/CompilationUpstreamRecoveryRunbook.md"

      - alert: EnhancementBudgetRejected
        expr: "increase(ragflow_x_enhancement_budget_rejected_total[15m]) > 0"
        for: 0m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Enhancement budget governance rejected work"
          description: "Compilation budget enforcement or cost accounting rejected or failed. Inspect tenant/dataset/profile/run budget status without changing raw retrieval."
          runbook: "doc/develop/08_部署运维与可观测性.md"

      - alert: ResourceSyncStaleRunRecovered
        expr: "increase(ragflow_x_resource_sync_stale_runs_total[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "A stale resource sync run was recovered"
          description: "A sync worker stopped refreshing its lease. Check worker liveness and scan duration before resuming imports."
          runbook: "doc/develop/08_部署运维与可观测性.md"

      - alert: ResourceSyncProgressStalled
        expr: "ragflow_x_resource_sync_run_progress{kind=\"total\"} > 0 and on(source_id) sum by (source_id) (increase(ragflow_x_resource_sync_items_total[30m])) == 0"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Resource sync progress is stalled"
          description: "A run reported work but no resource sync item has been processed for 30 minutes. Inspect the worker, lease, and current run."
          runbook: "doc/develop/08_部署运维与可观测性.md"
