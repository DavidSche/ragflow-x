groups:
  - name: ragflow-x-operational-contracts
    interval: 30s
    rules:
      - alert: AlertDeliveryCompensationSkippedHigh
        expr: "increase(ragflow_x_alert_delivery_compensation_skipped_total[15m]) > 50"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Alert delivery compensation skipped rows are accumulating"
          description: "More than 50 delivery compensation rows were skipped in 15 minutes. Inspect lease TTLs and compensation worker concurrency."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: AlertDeliveryAbandoned
        expr: "increase(ragflow_x_alert_delivery_compensation_abandoned_total[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Alert deliveries were abandoned"
          description: "A delivery exhausted its compensation policy. Check webhook targets and delivery attempts, then perform manual recovery."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: AlertDeliveryFencedResult
        expr: "increase(ragflow_x_alert_delivery_compensation_fenced_total[5m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Stale alert delivery result was fenced"
          description: "A stale worker attempted to write a delivery result. Preserve worker diagnostics and lease audit evidence before restarting."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: ResourceSyncItemsFailedHigh
        expr: "increase(ragflow_x_resource_sync_items_total{status=\"failed\"}[15m]) > 5"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Resource sync failure rate is elevated"
          description: "More than five resource sync items failed in 15 minutes. Inspect RAGFlow connectivity, mappings, and item errors."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: CompilationUpstreamStalled
        expr: "max by (tenant_id, kind) (ragflow_x_compilation_upstream_stall_seconds) > 86400"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Compilation upstream status is stalled"
          description: "A pending/running compilation has not advanced for 24 hours. Inspect the RAGFlow scheduler, phase, inflight and backlog diagnostics before manual recovery."
          runbook: "doc/operations/runbooks/CompilationUpstreamRecoveryRunbook.md"

      - alert: CompilationUnknownAgeWarning
        expr: "max by (tenant_id, kind) (ragflow_x_compilation_unknown_age_seconds) > 86400"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation unknown recovery is aging"
          description: "An unknown compilation run has remained unresolved for 24 hours. Use the read-only recovery probe and preserve evidence; never auto-retry."
          runbook: "doc/operations/runbooks/CompilationUpstreamRecoveryRunbook.md"

      - alert: CompilationUnknownAgeCritical
        expr: "max by (tenant_id, kind) (ragflow_x_compilation_unknown_age_seconds) > 259200"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Compilation unknown recovery requires escalation"
          description: "An unknown compilation run has remained unresolved for 72 hours. Review the recovery evidence, tenant approval, and downstream-binding candidates."
          runbook: "doc/operations/runbooks/CompilationUpstreamRecoveryRunbook.md"

      - alert: EnhancementBudgetRejected
        expr: "increase(ragflow_x_enhancement_budget_rejected_total[15m]) > 0"
        for: 0m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Enhancement budget governance rejected work"
          description: "Compilation budget enforcement or cost accounting rejected or failed. Inspect tenant/dataset/profile/run budget status without changing raw retrieval."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: ResourceSyncStaleRunRecovered
        expr: "increase(ragflow_x_resource_sync_stale_runs_total[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "A stale resource sync run was recovered"
          description: "A sync worker stopped refreshing its lease. Check worker liveness and scan duration before resuming imports."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: ResourceSyncProgressStalled
        expr: "ragflow_x_resource_sync_run_progress{kind=\"total\"} > 0 and on(source_id) sum by (source_id) (increase(ragflow_x_resource_sync_items_total[30m])) == 0"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Resource sync progress is stalled"
          description: "A run reported work but no resource sync item has been processed for 30 minutes. Inspect the worker, lease, and current run."
          runbook: "doc/architecture/08_部署运维与可观测性.md"

      - alert: MemorySearchUnauthorizedFilter
        expr: "increase(ragflow_x_memory_search_authorized_filter_total{result=\"unauthorized\"}[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Governed memory search bypassed the authorization filter"
          description: "An outbound memory search was recorded without enforced policy scope. Authorization filter enforcement is a fail-closed invariant (137 section 11.1); stop memory dispatch and inspect the search path before resuming."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: ContextPreModelAuthError
        expr: "increase(ragflow_x_context_pre_model_auth_total{result=\"error\"}[15m]) > 0"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Pre-model context authorization ended in errors"
          description: "Pre-model authorization calls failed on contract or conflict paths instead of an allow/deny decision (137 section 11.1). Inspect decision records and release manifest verification."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryPrincipalMappingFailure
        expr: "increase(ragflow_x_memory_dispatch_principal_mapping_total{result=\"failure\"}[15m]) > 0"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Memory principal mapping failures observed"
          description: "Principal mapping failed for memory operations or governed reads. The failure reason label classifies the cause (137 section 11.1). Verify principal state and identity derivation."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryUnauthorizedExternalDispatch
        expr: "increase(ragflow_x_memory_dispatch_unauthorized_external_dispatch_total[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "External dispatch observed without a valid admission state"
          description: "A memory operation reached the external write path without an admitted state. This is a fail-closed authorization contract violation (137 section 11.1); stop the dispatch worker and audit admission records."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryRevocationInvalidationAnomaly
        expr: "increase(ragflow_x_memory_dispatch_pending_invalidated_total{reason_class=\"user_action\"}[30m]) > 0 and increase(ragflow_x_memory_dispatch_revocation_event_total[30m]) == 0"
        for: 10m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "User-action invalidations without sampled revocation events"
          description: "Pending memory operations were invalidated by user action but no revocation event (opt-out, member exit, tombstone) was sampled in the same window. Revocation may not be effective (137 section 11.1); audit consent and generation changes."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: CompilationRunFailedDetected
        expr: "increase(ragflow_x_compilation_run_terminal_total{result=\"failed\"}[30m]) > 0"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation runs transitioned to failed"
          description: "One or more compilation runs ended in the failed state in 30 minutes (137 section 11.1). Inspect run failure codes and upstream pipeline health."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: CompilationRunUnknownDetected
        expr: "increase(ragflow_x_compilation_run_terminal_total{result=\"unknown\"}[30m]) > 0"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation runs entered the unknown state"
          description: "Dispatch or reconciliation could not confirm the upstream outcome (137 section 11.1). Follow the unknown recovery observation window before any recovery action."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: CompilationReadyRatioLow
        expr: "sum by (tenant_id) (increase(ragflow_x_compilation_ready_eval_total{result=\"ready\"}[1h])) / clamp_min(sum by (tenant_id) (increase(ragflow_x_compilation_ready_eval_total[1h])), 1) < 1 and sum by (tenant_id) (increase(ragflow_x_compilation_ready_eval_total[1h])) >= 5"
        for: 15m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation artifact readiness evaluations are incomplete"
          description: "Not every readiness evaluation in the last hour produced fully bound artifacts (137 section 11.1). Inspect artifact scan completeness and binding verification."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: CompilationArtifactBindingIncomplete
        expr: "increase(ragflow_x_compilation_artifact_binding_total{result=\"incomplete\"}[30m]) > 0"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation artifact bindings are incomplete"
          description: "Artifact projections failed run or content-hash binding verification (137 section 11.1). Compiled evidence must not be trusted until bindings are verified."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: CompilationQueueBacklogHigh
        expr: "max(ragflow_x_compilation_queue_depth{dimension=\"backlog\"}) > 0"
        for: 15m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Upstream compilation backlog is nonzero"
          description: "The upstream queue reports a persistent backlog (137 section 11.1 expects zero at rest). Inspect upstream capacity and dataset fan-out before dispatching more runs."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: RetrievalRawFallbackRatioHigh
        expr: "sum(increase(ragflow_x_retrieval_mode_total{result=\"raw_fallback\"}[30m])) / clamp_min(sum(increase(ragflow_x_retrieval_mode_total{mode=\"compiled_first\"}[30m])), 1) > 0.25 and sum(increase(ragflow_x_retrieval_mode_total{mode=\"compiled_first\"}[30m])) >= 5"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compiled-first raw fallback ratio exceeds 25 percent"
          description: "More than 25 percent of compiled-first retrieval attempts in 30 minutes fell back to raw-only evidence with at least 5 attempts (137 section 11.1). Check artifact projections and retrieval mode configuration."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryWriteSuccessRatioLow
        expr: "sum(increase(ragflow_x_memory_dispatch_external_result_total{result=\"executed\"}[30m])) / clamp_min(sum(increase(ragflow_x_memory_dispatch_external_result_total[30m])), 1) < 0.95 and sum(increase(ragflow_x_memory_dispatch_external_result_total[30m])) >= 5"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Memory external write success ratio dropped below 95 percent"
          description: "Less than 95 percent of memory external dispatch attempts ended executed in 30 minutes with at least 5 attempts (137 section 11.1). Inspect dispatch outcomes and provider health."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryUnknownResultAll
        expr: "sum(increase(ragflow_x_memory_dispatch_external_result_total{result=\"unknown\"}[20m])) / clamp_min(sum(increase(ragflow_x_memory_dispatch_external_result_total[20m])), 1) == 1 and sum(increase(ragflow_x_memory_dispatch_external_result_total[20m])) >= 5"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "All memory external dispatch results are unknown"
          description: "Every memory external dispatch in 20 minutes ended unknown with at least 5 attempts (137 section 11.1). Stop dispatch and follow tombstone compensation verification before resuming."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryPendingInvalidatedSystemMismatch
        expr: "increase(ragflow_x_memory_dispatch_pending_invalidated_total{reason_class=\"system_mismatch\"}[30m]) > 0"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "System-mismatch invalidations without a user action"
          description: "Admission invalidated accepted operations due to system-side drift (generation, identity) with no user action (137 section 11.1). Investigate races; user_action invalidations are audit-only and covered by the revocation anomaly alert."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: CompilationProjectionStaleDetected
        expr: "increase(ragflow_x_compilation_projection_stale_total[30m]) > 0"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Compilation artifact projections marked stale"
          description: "Artifact projections were marked stale in 30 minutes (137 section 11.1). Compiled-first retrieval must not trust stale projections; verify upstream artifacts and re-run projection maintenance."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryTombstoneVerificationFailed
        expr: "increase(ragflow_x_memory_tombstone_verification_total{result=\"failed\"}[15m]) > 0"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Tombstone enforcement verification failed"
          description: "Tombstone compensation could not verify external invisibility for one or more operations (137 section 11.1). Tombstone enforcement must stay at 100 percent; inspect provider errors and compensation audit."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: MemoryPrivacyGateBlockedRatioHigh
        expr: "sum(increase(ragflow_x_memory_privacy_gate_decision_total{decision=\"block\"}[30m])) / clamp_min(sum(increase(ragflow_x_memory_privacy_gate_decision_total[30m])), 1) > 0.05 and sum(increase(ragflow_x_memory_privacy_gate_decision_total[30m])) >= 5"
        for: 15m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Privacy gate blocks more than 5 percent of dispatch payloads"
          description: "The deterministic privacy gate blocked an unusual share of memory dispatch payloads (137 section 11.1). Review payload sources and exemption configuration before changing the gate."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: ContextDecisionLatencyHigh
        expr: "histogram_quantile(0.95, sum by (le, request_kind) (increase(ragflow_x_context_decision_duration_seconds_bucket{request_kind=~\"chat|preview\"}[15m]))) > 0.3"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Pre-model context decision p95 exceeds the 300ms budget"
          description: "Context decision p95 latency is above the 300ms budget for chat or preview requests (137 section 11.1). Search and evaluation kinds carry separate budgets and are outside this alert. Inspect decision persistence and release manifest verification latency."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: ContextDecisionSearchLatencyHigh
        expr: "histogram_quantile(0.95, sum by (le) (increase(ragflow_x_context_decision_duration_seconds_bucket{request_kind=\"search\"}[15m]))) > 0.5"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Search-kind context decision p95 exceeds the 500ms budget"
          description: "Search-kind context decision p95 latency is above the 500ms budget calibrated on the production-equivalent stack (M213: p50 156ms, p95 259ms, max 333ms; 500ms leaves proxy-contention headroom, 137 section 11.1 row ragfx_context_decision_p95). The search decision includes the downstream embedding round trip over the shared model proxy."
          runbook: "doc/operations/runbooks/GovernanceMetricsRunbook.md"

      - alert: ConnectorSyncFailureRateHigh
        expr: "sum(increase(ragflow_x_connector_runs_total{status=\"failed\"}[1h])) / clamp_min(sum(increase(ragflow_x_connector_runs_total[1h])), 1) > 0.3 and sum(increase(ragflow_x_connector_runs_total[1h])) >= 3"
        for: 10m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Data-source connector sync failure rate exceeds 30 percent"
          description: "More than 30 percent of connector sync runs failed in the last hour (doc/225 section 10). Inspect connector run history, provider reachability and credential status; a degraded connector keeps its cursor and retries on the next schedule."
          runbook: "doc/operations/runbooks/ConnectorSyncRunbook.md"

      - alert: ConnectorCredentialFailure
        expr: "increase(ragflow_x_connector_credential_failure_total[30m]) >= 2"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Repeated connector credential decryption failures"
          description: "At least two connector credential decryptions failed in 30 minutes (doc/225 section 10). Runs fail closed without touching the source. Verify the master encryption key version and rotate the credential through the approval flow."
          runbook: "doc/operations/runbooks/ConnectorSyncRunbook.md"
      # Report assurance (doc/301 §7.4). Five alerts, one per way a review can stop
      # being an assurance: it fails too often, it runs out of budget, the monthly
      # allowance drifts above its limit, a high finding is left unadjudicated, or the
      # quote layer cannot locate what the model quoted. A "coverage is low" alert is
      # deliberately absent: low coverage is a *report* fact the reader sees, not an
      # operational fault, and paging someone for honest abstention would train them to
      # ignore this file.

      - alert: AssuranceFailureRateHigh
        expr: "sum(increase(ragflow_x_report_assurance_runs_total{status=\"failed\"}[1h])) / clamp_min(sum(increase(ragflow_x_report_assurance_runs_total[1h])), 1) > 0.2 and sum(increase(ragflow_x_report_assurance_runs_total[1h])) >= 3"
        for: 15m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Report assurance run failure rate exceeds 20 percent"
          description: "More than one in five assurance runs failed in the last hour (doc/301 section 7.4). A failed run leaves the revision at `blocked`, so a tenant with a required gate cannot release reports. Inspect `report.assurance_failed` audit entries for `failure_code`: quota and budget codes are configuration, write and model codes are infrastructure."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      - alert: AssuranceBudgetExhausted
        expr: "sum(increase(ragflow_x_report_assurance_runs_total{budget_exhausted=\"true\"}[6h])) >= 3"
        for: 0m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Report assurance runs are hitting their token budget"
          description: "At least three assurance runs exhausted `report.assurance_budget_tokens` in six hours (doc/301 section 7.4). Exhausted runs close as `degraded` and their remaining claims are reported as `not_evaluated`, so coverage falls without anything failing. Either the budget is too small for the report size or a claim type is generating too many calls."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      - alert: AssuranceQuotaDriftHigh
        expr: "ragflow_x_assurance_quota_drift_ratio > 1.05"
        for: 30m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Assurance monthly allowance exceeded its limit"
          description: "Settled plus pending assurance tokens exceed the bucket limit by more than 5 percent (doc/301 section 6.5). The per-call reservation is supposed to make this impossible, so a drift means the reservation and the settle disagree: check `rgx_quota_bucket_reservation` for the affected tenant and confirm `report.assurance_monthly_tokens` was not lowered mid-period."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      - alert: AssuranceSettlementDriftHigh
        expr: "ragflow_x_assurance_settlement_drift_ratio > 0.01"
        for: 1h
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Assurance run ledger and quota bucket disagree by more than 1 percent"
          description: "The monthly reconciliation compared the sum of `rgx_report_assurance_run.quota_settled_tokens` with `rgx_quota_bucket.tokens_used - pending` for one tenant period and found a drift above the 1 percent ceiling (doc/301 section 6.5 / T25). This is an accounting disagreement, not a budget overrun: a reservation that was finalized twice, a settle that never committed, or a period boundary crossed mid-run will all show up here before the allowance gauge moves. Start from the tenant's runs in the period and compare `quota_settled_tokens` per run with the rows in `rgx_quota_bucket_reservation` whose `request_id` is `<run_id>:c<call_seq>`."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      - alert: AssuranceOpenHighFindings
        expr: "ragflow_x_report_assurance_findings_open{severity=\"high\"} > 0"
        for: 24h
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "High-severity review findings left unadjudicated for a day"
          description: "A report revision still has an open high-severity finding after 24 hours (doc/301 section 7.3). Open findings do not block export once acknowledged, which is exactly why an unadjudicated one is easy to forget: it stays `acknowledged` forever and the reader never learns whether it was real."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      - alert: AssuranceQuoteNotFound
        expr: "sum(increase(ragflow_x_report_assurance_claim_quote_status_total{quote_status=\"not_found\"}[6h])) >= 3"
        for: 0m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "Review model quoted text that no evidence snapshot contains"
          description: "At least three claims in six hours were quoted with text the snapshot cannot locate (doc/301 section 5.1). Each one is a `quote_unverifiable` finding. A handful is a model doing its own paraphrase; a cluster means the review prompt or the snapshot excerpt logic drifted, and every verdict from that window should be treated as unverified."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      # doc/319 R-01. A *share*, not a count, and the count clause is what keeps the
      # ratio honest: without the quorum a single expired citation in a quiet hour is
      # 100% and pages. This alert does not say the model misbehaved — it says the
      # evidence clock and the report clock disagree, which is a configuration fact
      # an operator can fix. It deliberately has no `tenant_id` label for the same
      # reason as the other assurance alerts (the plan defines no such dimension).
      - alert: AssuranceEvidenceExpiredShare
        expr: "sum(increase(ragflow_x_report_assurance_claim_quote_status_total{quote_status=\"evidence_expired\"}[6h])) >= 3 and sum(increase(ragflow_x_report_assurance_claim_quote_status_total{quote_status=\"evidence_expired\"}[6h])) / clamp_min(sum(increase(ragflow_x_report_assurance_claim_quote_status_total[6h])), 1) > 0.2"
        for: 30m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "More than a fifth of reviewed claims cite evidence that retention already cleared"
          description: "In the last six hours at least three claims, and more than 20 percent of all reviewed claims, carried `quote_status=evidence_expired` (doc/319 R-01 / doc/301 section 5.1). The snapshot existed and passed its window, so the run records `insufficient_evidence` without calling the model and raises a medium `traceability` finding: nothing is wrong with the author, and nothing is wrong with the judge either. What is wrong is the setting: `report.evidence_retention_days` is shorter than the report retention, or a draft sat unpublished across the boundary. Re-citing is the only repair for an affected claim; changing the retention now does not rewrite the runs that already expired."
          runbook: "doc/operations/runbooks/ReportAssuranceRunbook.md"

      # Gateway billing self-consistency (doc/301 §5.10 GW-3 / T21). Two alerts, and
      # they answer two different questions: "did the four ledgers disagree" and "did
      # the check even run". A single alert over both would let a permanently failing
      # sweep look like a spotless day.
      #
      # The findings alert is quorum-gated on `checked`: one disagreement among two
      # looked-at rows is a broken deployment, one among thirty thousand is a rare bug,
      # and an unguarded `> 0` cannot tell them apart.

      - alert: GatewayBillingReconcileMismatch
        expr: "sum by (tenant_id) (increase(ragflow_x_gateway_billing_reconcile_findings_total[25h])) > 0 and sum by (tenant_id) (increase(ragflow_x_gateway_billing_reconcile_checked_total[25h])) >= 3"
        for: 0m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Gateway billing ledgers disagree on the reconciled day"
          description: "The daily reconciliation found at least one disagreement between `rgx_gateway_idempotency`, `rgx_meter_request`, `rgx_quota_usage` and `rgx_cost_metric` (doc/301 section 5.10 GW-3). Which kind fired says what happened: `missing_meter` served a request for free, `missing_cost` under-reported spend, `charged_after_failure` billed a request that failed, `duplicate_request` is the replay-double-billing shape (one request id on two retry rows), `stale_reservation` is a phantom balance locking a key, `quota_drift` means the settlement ledger and the key counter disagree, and `usage_drift` means the daily aggregate billed a different request count than the metering ledger stamped. Read the run's findings with `GET /api/v1/usage/reconcile` then `GET /api/v1/usage/reconcile/{runId}/findings?kind=<kind>`. Do not clear the alert by deleting rows: the finding is the evidence."
          runbook: "doc/operations/runbooks/GatewayBillingReconcileRunbook.md"

      - alert: GatewayBillingReconcileFailed
        expr: "sum by (tenant_id) (increase(ragflow_x_gateway_billing_reconcile_runs_total{status=\"failed\"}[25h])) >= 1"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "A day went unreconciled: the billing check failed"
          description: "At least one daily reconciliation run closed as `failed` in the last 25 hours (doc/301 section 5.10 GW-3). The day is *unreconciled*, not clean: a dataset query or a schema regression failed the run, and `failure_reason` on the run row says which. Re-run it once fixed with `POST /api/v1/system/usage/reconcile?day=YYYY-MM-DD`; the unique `(tenant_id, day)` index makes the re-run safe and returns the stored run if it already finished."
          runbook: "doc/operations/runbooks/GatewayBillingReconcileRunbook.md"

      # Gateway metering integrity (doc/304 §4 E147). Three readings, and they are
      # three because E146 showed one cannot answer another: "a write failed" is an
      # event, "intents are still unsettled" is a state, and "the sweep ran" is the
      # liveness of the repair. An `unsettled == 0` from a sweep that never ran is the
      # ambiguous zero this family exists to remove.
      #
      # The write-failure counter only increments after the built-in retry, so a
      # single increment already means a served request whose books are missing now.

      - alert: GatewayMeteringWriteFailed
        expr: "sum by (tenant_id, ledger) (increase(ragflow_x_gateway_metering_write_failure_total{ledger=~\"aggregate|detail\"}[1h])) >= 1"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "A served gateway request could not be metered"
          description: "At least one metering ledger write failed twice in the last hour (doc/304 section 4 E147), so a request was served with books that are missing or in doubt. `ledger=aggregate` means the daily quota/cost aggregate is short; `ledger=detail` means the per-request cost row is missing (the aggregate landed). The request is not lost: its intent is queued and replayed by the metering recovery sweep, which is idempotent by request id. Read the queue with `GET /api/v1/usage/metering` (the request ids and the stored cause), then confirm the replay with `ragflow_x_gateway_metering_recovered_total`."
          runbook: "doc/operations/runbooks/GatewayBillingReconcileRunbook.md"

      - alert: GatewayMeteringUnsettled
        expr: "sum by (tenant_id) (ragflow_x_gateway_metering_unsettled_intents) > 0"
        for: 30m
        labels:
          severity: critical
          service: ragflow-x
        annotations:
          summary: "Metering intents have been unsettled for half an hour"
          description: "`pending` plus `failed` intents have stayed above zero for 30 minutes (doc/304 section 4 E147). A transient blip is repaired by the request's own retry; half an hour of the same gap means the ledger writes are not recovering on their own. Every one of these rows is a served request that the day's cost report does not contain. Read them with `GET /api/v1/usage/metering` (state, attempts, last_error) and pair this alert with `GatewayMeteringRecoveryStalled`: a stale `unsettled_intents` gauge is not a clean reading."
          runbook: "doc/operations/runbooks/GatewayBillingReconcileRunbook.md"

      - alert: GatewayMeteringRecoveryStalled
        expr: "time() - ragflow_x_gateway_metering_sweep_last_success_timestamp_seconds > 900 or absent(ragflow_x_gateway_metering_sweep_last_success_timestamp_seconds)"
        for: 5m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "The metering recovery sweep is not running"
          description: "No metering recovery pass has completed in 15 minutes, or the series has never appeared (doc/304 section 4 E147). The sweep is the only path that replays an intent whose ledger write failed, so while it is down the gap stays a gap and `unsettled_intents` is a stale number rather than a current one. Check that the `metering_recovery` job exists and is not stuck (`GET /api/v1/tasks/jobs?kind=metering_recovery`); the job re-arms itself, so a missing job means the last pass failed before rescheduling."
          runbook: "doc/operations/runbooks/GatewayBillingReconcileRunbook.md"

      # Gateway route latency (doc/301 §5.10 GW-2 / T14). Threshold provenance is the
      # measured baseline in tmp/perf/gateway-baseline-*.md — the 2s non-stream budget
      # is the one the probe judges cells against, and the alert exists so a *steady*
      # drift past it pages someone instead of waiting for the next manual baseline.
      #
      # Dimension is `route`, not `tenant`: the histogram is labelled by gin FullPath
      # (internal/obs/obs.go Middleware), and a tenant label here would need cardinality
      # the metric does not carry. Per-tenant slowness is a separate question.

      - alert: GatewayRouteLatencyHigh
        expr: "histogram_quantile(0.95, sum by (le, route) (increase(ragflow_x_http_request_duration_seconds_bucket{route=~\"/v1/.*\"}[15m]))) > 2"
        for: 15m
        labels:
          severity: warning
          service: ragflow-x
        annotations:
          summary: "API-key gateway route p95 latency is above the 2s budget"
          description: "A `/v1/*` route has kept a p95 above 2s for 15 minutes (doc/301 section 5.10 GW-2, baseline in tmp/perf). Two things must be separated before touching anything: if `ragflow_x_ragflow_request_duration_seconds` for the same path rose too, the time is upstream (engine or model provider) and the gateway is innocent; if only the gateway histogram rose, look at quota/idempotency writes and the rate limiter. `search-apps` cells at concurrency 1 measured p95 59ms on the 151 stack, so a 2s p95 is roughly 34 times the baseline, not a slow afternoon."
          runbook: "doc/operations/runbooks/GatewayPerformanceRunbook.md"
